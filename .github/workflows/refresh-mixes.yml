name: Свежие миксы на визитке

# Раз в 6 часов подставляем в index.html id двух последних миксов канала.
# Источник — публичный RSS, ключ API не нужен. Расписание GitHub держит
# нестрого, задержка в десятки минут — норма; кнопка «Run workflow»
# запускает вручную, когда выпуск нужно показать сразу.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-mixes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Прочитать ленту и обновить страницу
        run: python3 .github/scripts/refresh_mixes.py

      - name: Закоммитить, если что-то изменилось
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "Миксы прежние — коммитить нечего."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Свежие миксы на визитке" -- index.html
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Пуш, сделанный токеном GITHUB_TOKEN, НЕ запускает другие workflow —
      # включая pages-build-deployment. Без этого шага коммит робота лёг бы
      # в репозиторий, а сайт остался бы со старыми миксами. Просим сборку
      # страниц явно.
      - name: Попросить GitHub Pages пересобраться
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
