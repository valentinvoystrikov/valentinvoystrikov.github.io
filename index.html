<style>

    min-height: 100vh; display: flex; align-items: center; justify-content: center;

    width: 100%; max-width: 320px; padding: 13px 20px;
    border: 1px solid rgba(243, 238, 252, .35); border-radius: 999px;
    color: #f3eefc; text-decoration: none; font-size: 1rem;
    transition: background .2s, border-color .2s;
  }
  .links a:hover { background: rgba(243, 238, 252, .1); border-color: rgba(243, 238, 252, .7); }
  .links a svg { width: 24px; height: 24px; flex: none; }
